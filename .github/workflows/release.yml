# The one ordered route from main to production:
# application gates -> clean schema replay -> Supabase apply -> exact-SHA VPS.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citefleet-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: suwikadkcqgozlaxfyrv
  CITEFLEET_VPS_HOST: 144.91.66.158

jobs:
  quality:
    uses: ./.github/workflows/checks.yml

  schema:
    needs: quality
    uses: ./.github/workflows/supabase-migrations.yml

  migrate:
    needs: schema
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Link CiteFleet's Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Show pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list
      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
      - name: Confirm local and remote ledgers agree
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://citefleet.app
    steps:
      - name: Deploy the exact release commit
        env:
          DEPLOY_KEY: ${{ secrets.CITEFLEET_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.CITEFLEET_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/citefleet_deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/citefleet_deploy" "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/citefleet_deploy"' EXIT
          ssh -i "$HOME/.ssh/citefleet_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            root@"$CITEFLEET_VPS_HOST" \
            "deploy $GITHUB_SHA"
      - name: Verify live revision and public entry points
        run: |
          set -euo pipefail
          health="$(curl --retry 10 --retry-all-errors --retry-delay 3 -fsS https://citefleet.app/health)"
          printf '%s' "$health" | jq -e --arg revision "$GITHUB_SHA" \
            '.ok == true and .db == "postgres" and .revision == $revision'
          test "$(curl -fsS -o /dev/null -w '%{http_code}' https://citefleet.app/login)" = "200"
          providers="$(curl -fsS https://citefleet.app/api/oauth/providers)"
          printf '%s' "$providers" | jq -e \
            '(.google | type == "boolean") and (.github | type == "boolean")'
          headers="$(curl -fsS -D - -o /dev/null https://citefleet.app/login)"
          for header in \
            strict-transport-security \
            x-content-type-options \
            referrer-policy \
            permissions-policy \
            content-security-policy; do
            printf '%s\n' "$headers" | grep -qi "^$header:"
          done
