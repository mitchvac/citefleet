# Reusable schema gate. Production writes belong to release.yml, after this
# workflow has replayed every migration from an empty Postgres instance.
name: Supabase schema

on:
  workflow_call:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-migrations.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 2.116.0
      - name: Start local Postgres
        run: supabase db start
      - name: Replay all migrations from scratch
        run: supabase db reset
      - name: Lint the resulting schema
        run: supabase db lint --level warning
