# CiteFleet — nginx vhost for citefleet.app ONLY.
# Install:  sudo cp deploy/nginx-citefleet.app.conf /etc/nginx/sites-available/citefleet
#           sudo ln -sfn /etc/nginx/sites-available/citefleet /etc/nginx/sites-enabled/citefleet
#           sudo nginx -t && sudo systemctl reload nginx
# Then SSL: sudo certbot --nginx -d citefleet.app -d www.citefleet.app
#
# THIS BOX ALSO HOSTS resonanse.app (127.0.0.1:3019), botcentral.org
# (127.0.0.1:3020), AND wflowprocess.app (127.0.0.1:8090 / 8091).
# Do not add default_server. Do not `rm` other sites-enabled files.
# Do not 301 unknown Hosts here.

# www → apex redirect
server {
    listen 80;
    server_name www.citefleet.app;
    return 301 https://citefleet.app$request_uri;
}

server {
    listen 80;
    server_name citefleet.app;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
